[project]
name = "eratranslator-team-server"
version = "0.1.0"
description = "Team collaboration server for EraTranslator."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

